apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  labels:
    app: payment-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
        - name: payment-service
          image: freshcart-payment-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8001

          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"

          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: payment-service
  labels:
    app: payment-service

spec:
  type: ClusterIP

  selector:
    app: payment-service

  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001