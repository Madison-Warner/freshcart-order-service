apiVersion: apps/v1
kind: Deployment

metadata:
  name: warehouse-service
  labels:
    app: warehouse-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: warehouse-service

  template:
    metadata:
      labels:
        app: warehouse-service

    spec:
      containers:
        - name: warehouse-service
          image: freshcart-warehouse-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8003

          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"

          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
apiVersion: v1
kind: Service

metadata:
  name: warehouse-service
  labels:
    app: warehouse-service

spec:
  type: ClusterIP

  selector:
    app: warehouse-service

  ports:
    - protocol: TCP
      port: 8003
      targetPort: 8003