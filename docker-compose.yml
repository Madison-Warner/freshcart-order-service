version: '3.8'

services:
  # RabbitMQ message broker service
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      # AMQP protocol port (used by applications)
      - "5672:5672"
      # Management UI port
      - "15672:15672"
    environment:
      # Default RabbitMQ credentials
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      # Persist RabbitMQ data between container restarts
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freshcart-network

  # Order Service - FastAPI microservice
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      # Expose FastAPI application on port 8000
      - "8000:8000"
    environment:
      # RabbitMQ connection details
      # Service communicates with RabbitMQ using the service name as hostname
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      # Application environment
      DEBUG: "false"
    volumes:
      # Mount app directory for development (optional - remove for production)
      - ./order-service/app:/app/app
      # Persist SQLite database
      - ./order-service/data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - freshcart-network
    restart: unless-stopped

  # Payment Service - FastAPI microservice for payment processing
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      # Expose FastAPI application on port 8001
      - "8001:8001"
    environment:
      # RabbitMQ connection details
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      # Application environment
      DEBUG: "false"
    volumes:
      # Mount app directory for development (optional - remove for production)
      - ./payment-service/app:/app/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - freshcart-network
    restart: unless-stopped

  # Inventory Service - FastAPI microservice for stock management
  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      # Expose FastAPI application on port 8002
      - "8002:8002"
    environment:
      # RabbitMQ connection details
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      # Application environment
      DEBUG: "false"
    volumes:
      # Mount app directory for development (optional - remove for production)
      - ./inventory-service/app:/app/app
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - freshcart-network
    restart: unless-stopped

# Named volume for RabbitMQ persistence
volumes:
  rabbitmq_data:
    driver: local

# Custom network for inter-service communication
networks:
  freshcart-network:
    driver: bridge
